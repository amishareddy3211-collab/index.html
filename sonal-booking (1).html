<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sonal Spa & Massage — Booking</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f3ef;color:#222}
.wrap{max-width:560px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 30px #00000012;margin:14px 0}
h1{margin:0 0 6px;font-size:28px}.sub{color:#666;margin-bottom:20px}
label{display:block;font-weight:700;margin:13px 0 6px}input,select,button{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;font-size:16px}
button{border:0;background:#222;color:#fff;font-weight:700;margin-top:16px;cursor:pointer}.status{margin-top:12px;padding:10px;border-radius:10px;display:none}
.admin{display:none}.qr{max-width:220px;display:block;margin:12px auto;border-radius:10px}.small{font-size:13px;color:#777}
.tabs{display:flex;gap:8px}.tabs button{margin:0;background:#eee;color:#222}.tabs button.active{background:#222;color:#fff}
.item{border:1px solid #eee;padding:12px;border-radius:12px;margin:9px 0}
.danger{background:#b42318}.success{background:#087443}
</style>
</head>
<body>
<div class="wrap">

<div class="card">
  <h1>Sonal Spa & Massage</h1>
  <div class="sub">24-hour booking • Please select your preferred time.</div>

  <form id="bookingForm">
    <label>Name</label>
    <input id="name" required placeholder="Your name">

    <label>Mobile number</label>
    <input id="phone" required inputmode="tel" placeholder="10-digit mobile number">

    <label>Service</label>
    <select id="service" required>
      <option value="">Select service</option>
      <option>Massage</option>
      <option>Spa Session</option>
      <option>Other</option>
    </select>

    <label>Duration</label>
    <select id="duration" required>
      <option value="">Select duration</option>
      <option value="1 Hour">1 Hour</option>
      <option value="2 Hours">2 Hours</option>
      <option value="4 Hours">4 Hours — ₹5,000</option>
      <option value="Full Day">Full Day — ₹6,500</option>
    </select>

    <label>Booking date</label>
    <input id="date" type="date" required>

    <label>Preferred time</label>
    <input id="time" type="time" required>

    <button type="submit">Confirm Booking</button>
    <div id="bookingStatus" class="status"></div>
  </form>
</div>

<div class="card">
  <h2>Admin</h2>
  <div class="tabs">
    <button id="showLogin" class="active" type="button">Login</button>
    <button id="showDashboard" type="button">Dashboard</button>
  </div>

  <div id="loginBox">
    <label>Email</label>
    <input id="adminEmail" type="email" placeholder="Admin email">
    <label>Password</label>
    <input id="adminPassword" type="password" placeholder="Password">
    <button id="loginBtn" type="button">Admin Login</button>
    <div id="loginStatus" class="status"></div>
  </div>

  <div id="adminBox" class="admin">
    <h3>Bookings</h3>
    <div id="bookings">Loading...</div>

    <h3>Payment QR</h3>
    <p class="small">This version stores a QR image URL. For actual file upload, use Firebase Storage and Storage Rules.</p>
    <label>QR image URL</label>
    <input id="qrUrl" placeholder="https://.../qr.png">
    <button id="saveQr" type="button">Save QR URL</button>
    <img id="qrPreview" class="qr" alt="QR preview" style="display:none">
    <button id="logoutBtn" class="danger" type="button">Logout</button>
  </div>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import { getDatabase, ref, push, set, onValue, update } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAGasA9tpMlGclBC3devwfGaYvifBmDG-c",
  authDomain: "sonali-booking-1.firebaseapp.com",
  databaseURL: "https://sonali-booking-1-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "sonali-booking-1",
  storageBucket: "sonali-booking-1.firebasestorage.app",
  messagingSenderId: "886918705079",
  appId: "1:886918705079:web:acab7dbe29ccf2db168232",
  measurementId: "G-FGSK0L71CE"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

const $ = id => document.getElementById(id);
const status = (el,msg,ok=false) => { el.textContent=msg; el.style.display="block"; el.className="status "+(ok?"success":""); };

$("date").min = new Date().toISOString().split("T")[0];

$("bookingForm").addEventListener("submit", async e => {
  e.preventDefault();
  const phone=$("phone").value.replace(/\D/g,"");
  if(phone.length!==10){status($("bookingStatus"),"Please enter a valid 10-digit mobile number.");return}
  try{
    const bookingRef=push(ref(db,"bookings"));
    await set(bookingRef,{
      name:$("name").value.trim(),
      phone,
      service:$("service").value,
      duration:$("duration").value,
      date:$("date").value,
      time:$("time").value,
      status:"pending",
      createdAt:Date.now()
    });
    status($("bookingStatus"),"Booking submitted successfully.",true);
    $("bookingForm").reset();
    $("date").min = new Date().toISOString().split("T")[0];
  }catch(err){status($("bookingStatus"),"Could not save booking: "+err.message)}
});

$("loginBtn").onclick=async()=>{
  try{
    await signInWithEmailAndPassword(auth,$("adminEmail").value,$("adminPassword").value);
    status($("loginStatus"),"Logged in successfully.",true);
  }catch(err){status($("loginStatus"),"Login failed: "+err.message)}
};

onAuthStateChanged(auth,user=>{
  $("adminBox").style.display=user?"block":"none";
  $("loginBox").style.display=user?"none":"block";
  if(user) loadAdmin();
});

$("logoutBtn").onclick=()=>signOut(auth);

$("showLogin").onclick=()=>{
  $("loginBox").style.display="block";
  $("adminBox").style.display=auth.currentUser?"block":"none";
};
$("showDashboard").onclick=()=>{
  $("adminBox").style.display=auth.currentUser?"block":"none";
  $("loginBox").style.display=auth.currentUser?"none":"block";
};

function loadAdmin(){
  onValue(ref(db,"bookings"),snap=>{
    const data=snap.val()||{};
    const entries=Object.entries(data).sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0));
    $("bookings").innerHTML=entries.length?entries.map(([id,b])=>`
      <div class="item">
        <b>${escapeHtml(b.name)}</b><br>
        ${escapeHtml(b.phone)}<br>
        ${escapeHtml(b.service)} • ${escapeHtml(b.duration)}<br>
        ${escapeHtml(b.date)} ${escapeHtml(b.time)}<br>
        Status: <b>${escapeHtml(b.status||"pending")}</b>
        <button type="button" onclick="markDone('${id}')">Mark confirmed</button>
      </div>`).join(""):"No bookings yet.";
  });
  onValue(ref(db,"settings/qrUrl"),snap=>{
    const url=snap.val()||"";
    $("qrUrl").value=url;
    $("qrPreview").src=url;
    $("qrPreview").style.display=url?"block":"none";
  });
}

window.markDone=async id=>update(ref(db,"bookings/"+id),{status:"confirmed"});
$("saveQr").onclick=async()=>{
  try{
    await set(ref(db,"settings/qrUrl"),$("qrUrl").value.trim());
    alert("QR URL saved.");
  }catch(e){alert(e.message)}
};

function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
</script>
</body>
</html>
